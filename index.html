function speak(text, interrupt=true){if(!speechOn||!('speechSynthesis'in window))return;if(interrupt)speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.rate=1.02;u.pitch=1;let vv=speechSynthesis.getVoices();u.voice=vv.find(v=>/Samantha|Tessa|Serena|Karen/i.test(v.name))||vv.find(v=>/^en-GB/i.test(v.lang))||vv.find(v=>/^en/i.test(v.lang));speechSynthesis.speak(u)}
function play(name,{loop=false,volume=.7,restart=true}={}){let src=sounds[name];if(!src)return null;let a=new Audio(src);a.loop=loop;a.volume=volume;if(restart)a.currentTime=0;a.play().catch(()=>{});return a}
function stopAmb(){if(ambience){ambience.pause();ambience=null}}
function setAmb(name){stopAmb();if(name)ambience=play(name,{loop:true,volume:.22})}
function d(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function nearest(){return [...places].sort((a,b)=>d(S,a)-d(S,b))[0]}
function relDir(p){let dx=p.x-S.x,dy=p.y-S.y;let abs=Math.atan2(dx,-dy)*180/Math.PI;if(abs<0)abs+=360;let facing=S.dir*90;let r=(abs-facing+360)%360;if(r<22.5||r>=337.5)return'ahead';if(r<67.5)return'ahead and right';if(r<112.5)return'right';if(r<157.5)return'behind and right';if(r<202.5)return'behind';if(r<247.5)return'behind and left';if(r<292.5)return'left';return'ahead and left'}
function meters(p){return Math.max(1,Math.round(d(S,p)*2))}
function currentArea(){let n=nearest();return d(S,n)<8?n.name:(S.x>44&&S.x<56?'Main road':'Town street')}
function render(){
 $('#player').style.left=S.x+'%';$('#player').style.top=S.y+'%';$('#player').style.transform=`translate(-50%,-50%) rotate(${S.dir*90}deg)`;
 localStorage.setItem('blindTownAutosave',JSON.stringify(S));
}
function buildMap(){for(let p of places){let e=document.createElement('div');e.className='landmark';e.textContent=p.name;e.style.left=p.x+'%';e.style.top=p.y+'%';$('#map').appendChild(e)}}
function move(direction=1){
 if(S.inside)return;
 let step=(S.inVehicle?5:2.2)*direction;let old={x:S.x,y:S.y};
 if(S.dir===0)S.y-=step;if(S.dir===1)S.x+=step;if(S.dir===2)S.y+=step;if(S.dir===3)S.x-=step;
 S.x=Math.max(2,Math.min(98,S.x));S.y=Math.max(2,Math.min(98,S.y));
 if(S.x===old.x&&S.y===old.y){play('lockbeep',{volume:.25});return}
 if(S.inVehicle){S.carX=S.x;S.carY=S.y;play('carengine',{volume:.22})}else play('concrete',{volume:.38});
 render();
}
function turn(delta){S.dir=(S.dir+delta+4)%4;play('lockbeep',{volume:.16});render()}
function scan(){if(S.inside){let r=interiors[S.inside][S.room];speak(r.name+'. '+r.items.map(x=>x[0]).join('. ')+'.');return}let near=[...places].sort((a,b)=>d(S,a)-d(S,b)).slice(0,4);speak(near.map(p=>`${p.name}, ${meters(p)} metres ${relDir(p)}`).join('. ')+'.')}
function where(){if(S.inside){let p=places.find(p=>p.type===S.inside);speak('You are inside '+p.name+', in the '+interiors[S.inside][S.room].name+'.');return}let n=nearest();speak('You are '+(d(S,n)<8?'at '+n.name:'on a town street')+', facing '+dirs[S.dir]+'. '+n.name+' is '+meters(n)+' metres '+relDir(n)+'.')}
function enterNearest(){
 if(S.inside){primaryRoomAction();return}
 let n=nearest();if(d(S,n)>8){play('lockbeep',{volume:.28});return}
 if(S.inVehicle){play('lockbeep',{volume:.28});return}
 S.inside=n.type;S.room=0;play('door');setAmb(interiors[S.inside][0].amb);render();
}
function primaryRoomAction(){
 if(!S.inside)return;let r=interiors[S.inside][S.room];if(!r||!r.items.length)return;
 let it=r.items[0];if(it[1])play(it[1],{volume:.75});
 if(/sit/i.test(it[0])){S.sitting=true;S.lying=false}
 if(/bed|lie/i.test(it[0])){S.lying=true;S.sitting=false}
 if(/keys/i.test(it[0]))S.holding='house keys';render();
}
function secondaryRoomAction(){
 if(!S.inside)return;let r=interiors[S.inside][S.room];let it=r&&r.items[1];if(!it){play('lockbeep',{volume:.22});return}
 if(it[1])play(it[1],{volume:.75});
 if(/sit/i.test(it[0])){S.sitting=true;S.lying=false}
 if(/bed|lie/i.test(it[0])){S.lying=true;S.sitting=false}
 if(/keys/i.test(it[0]))S.holding='house keys';render();
}
function exitBuilding(){if(!S.inside)return;let p=places.find(p=>p.type===S.inside);S.x=p.x;S.y=Math.min(98,p.y+7);S.inside=null;S.room=0;stopAmb();play('door');render()}
function btn(label,action,say=label){return `<button data-act="${action}" data-speak="${say.replace(/"/g,'&quot;')}">${label}</button>`}
function showPanel(title,html){$('#panelTitle').textContent=title;$('#panelBody').innerHTML=html;$('#panel').classList.remove('hidden');speak(title+'. Slide your finger over the choices and lift to activate.')}
function closePanel(){$('#panel').classList.add('hidden')}
function openRoomActions(){let r=interiors[S.inside][S.room];let h=r.items.map((it,i)=>btn(it[0],`roomItem:${i}`)).join('');h+=btn('Previous Room','prevRoom')+btn('Next Room','nextRoom')+btn('Leave Building','leaveBuilding');showPanel(r.name,h)}
function roomItem(i){let it=interiors[S.inside][S.room].items[i];if(it[1])play(it[1],{volume:.75});if(/sit/i.test(it[0])){S.sitting=true;S.lying=false}if(/bed/i.test(it[0])){S.lying=true;S.sitting=false}if(/keys/i.test(it[0]))S.holding='house keys';speak(it[2]);render()}
function roomStep(delta){let rooms=interiors[S.inside];S.room=(S.room+delta+rooms.length)%rooms.length;let r=rooms[S.room];setAmb(r.amb);play('ding',{volume:.22});render()}
function playLibrarySound(i){
 const s=fullSoundLibrary[i]; if(!s)return;
 try{let a=new Audio(s.path);a.volume=.8;a.play().catch(()=>{});}catch(e){}
 speak(s.label+'.');
}

function backpackMenu(){
 let held=S.holding==='nothing'?'Your backpack is empty.':'You are carrying '+S.holding+'.';
 showPanel('Backpack',`<div class="notice">${held}</div>`+btn('House Keys','keysAction')+btn('Phone','phoneAction')+btn('Close','closePanel'));
}
function avatarMenu(){
 showPanel('Avatar',btn('Stand','stand')+btn('Sit','sit')+btn('Lie Down','lie')+btn('Jump','jump')+btn('Close','closePanel'));
}
function vehicle(){
 if(S.inside){play('lockbeep',{volume:.28});return}
 if(S.inVehicle){S.inVehicle=false;S.carX=S.x;S.carY=S.y;play('carstop');setTimeout(()=>play('caropen'),260);render();return}
 let car={x:S.carX,y:S.carY};if(d(S,car)>8){S.carX=S.x;S.carY=S.y;play('keys');return}
 play('caropen');setTimeout(()=>play('carstart'),360);S.inVehicle=true;render();
}
function summonCar(){closePanel();S.carX=S.x;S.carY=S.y;play('keys');speak('Your car has been brought beside you. Press Vehicle to get in.');render()}
function weather(){if(S.rain){S.rain=false;stopAmb();speak('The rain stops.')}else{S.rain=true;setAmb('rain');speak('Rain begins falling over the town.')}render()}
function save(){localStorage.setItem('blindTownSave',JSON.stringify(S));play('message',{volume:.25})}
function start(load=true){if(load){try{Object.assign(S,JSON.parse(localStorage.getItem('blindTownAutosave')||localStorage.getItem('blindTownSave')||'{}'))}catch(e){}}render();}
function how(){scan()}
function exitGame(){save()}
function action(act){if(act==='scan')scan();else if(act==='where')where();else if(act==='interact')enterNearest();else if(act==='vehicle')vehicle();}

// World-only gesture controls. No on-screen buttons.
// 1 finger drag: walk/steer. 1 tap: interact. Double tap: secondary indoor action.
// 2 finger tap: scan. 3 finger tap: where am I. 4 finger tap: enter/exit vehicle.
// Indoors, swipe up/down changes room; long press leaves the building.
let touchCount=0,startX=0,startY=0,lastX=0,lastY=0,startTime=0,moveTimer=null;
let dragDX=0,dragDY=0,lastTurn=0,longTimer=null,longTriggered=false,lastTap=0;
const surface=$('#gestureSurface');
function updateMotion(){
 if(!touchCount||touchCount!==1||S.inside)return;
 const dead=16;
 if(Math.abs(dragDX)>dead && Date.now()-lastTurn>190){turn(dragDX>0?1:-1);lastTurn=Date.now();}
 if(Math.abs(dragDY)>dead)move(dragDY<0?1:-1);
}
function clearGestureTimers(){if(moveTimer){clearInterval(moveTimer);moveTimer=null}if(longTimer){clearTimeout(longTimer);longTimer=null}}
surface.addEventListener('touchstart',e=>{
 touchCount=e.touches.length;startTime=Date.now();longTriggered=false;
 if(touchCount===1){let t=e.touches[0];startX=lastX=t.clientX;startY=lastY=t.clientY;dragDX=dragDY=0;lastTurn=0;
   moveTimer=setInterval(updateMotion,240);
   longTimer=setTimeout(()=>{if(S.inside&&Math.abs(dragDX)<14&&Math.abs(dragDY)<14){longTriggered=true;exitBuilding();play('door',{volume:.65});}},700);
 }
 e.preventDefault();
},{passive:false});
surface.addEventListener('touchmove',e=>{
 if(e.touches.length===1&&touchCount===1){let t=e.touches[0];lastX=t.clientX;lastY=t.clientY;dragDX=lastX-startX;dragDY=lastY-startY;if(Math.abs(dragDX)>14||Math.abs(dragDY)>14){if(longTimer){clearTimeout(longTimer);longTimer=null}}}
 e.preventDefault();
},{passive:false});
surface.addEventListener('touchend',e=>{
 let elapsed=Date.now()-startTime;let dx=lastX-startX,dy=lastY-startY;let dist=Math.hypot(dx,dy);let count=touchCount;clearGestureTimers();touchCount=0;
 if(longTriggered){e.preventDefault();return}
 if(count===1){
   if(S.inside && dist>55 && Math.abs(dy)>Math.abs(dx)){roomStep(dy<0?1:-1);e.preventDefault();return}
   if(dist<18 && elapsed<420){let now=Date.now();if(now-lastTap<330){lastTap=0;secondaryRoomAction()}else{lastTap=now;setTimeout(()=>{if(lastTap===now){lastTap=0;enterNearest()}},340)}}
 }else if(count===2 && elapsed<650){scan()}
 else if(count===3 && elapsed<650){where()}
 else if(count>=4 && elapsed<650){vehicle()}
 e.preventDefault();
},{passive:false});

addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(k==='arrowup'||k==='w')move();else if(k==='arrowleft'||k==='a')turn(-1);else if(k==='arrowright'||k==='d')turn(1);else if(k===' ')scan();else if(k==='enter')enterNearest();else if(k==='l')where();else if(k==='v')vehicle();else return;e.preventDefault()});
buildMap();start(true);
})();
