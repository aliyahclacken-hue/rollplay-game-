}
function enterScene(p){state.lastOutside={x:state.x,y:state.y};state.outside=false;state.scene=p.id;state.x=12;state.y=14;state.seated=false;state.lying=false;stopLoop();if(p.amb)play(p.amb,true);focusKey="";focusObj=null;render();speak(p.name);}
function exitScene(){state.outside=true;state.scene=null;state.x=state.lastOutside.x;state.y=state.lastOutside.y;stopLoop();focusKey="";focusObj=null;render();play("door");}
function toggleState(i,type){const k=state.scene+":"+i,cur=state.objectStates[k];state.objectStates[k]=cur===type?null:type;render();return state.objectStates[k];}
function interact(){
 if(state.outside){
  let p=focusObj&&focusObj.kind==="place"?focusObj.data:null;if(!p){const n=nearestPlace();p=n&&n.p;}
  if(!p||Math.hypot(p.x-state.x,p.y-state.y)>10){play("lock");return;}
  enterScene(p);return;
 }
 let o=null,i=-1;
 if(focusObj&&focusObj.kind==="object"){o=focusObj.data;i=focusObj.index;}else{const n=nearestObject();if(n){o=n.o;i=n.i;}}
 if(!o||Math.hypot(o[1]-state.x,o[2]-state.y)>11){play("lock");return;}
 const action=o[4],snd=o[3],name=o[0].toLowerCase();
 if(action==="exit"){if(snd)play(snd);setTimeout(exitScene,180);return;}
 if(action==="sit"){state.seated=true;state.lying=false;state.x=o[1];state.y=o[2];state.objectStates[state.scene+":"+i]="occupied";if(snd)play(snd);render();return;}
 if(action==="lie"){state.lying=true;state.seated=false;state.x=o[1];state.y=o[2];state.objectStates[state.scene+":"+i]="occupied";if(snd)play(snd);render();return;}
 if(name.includes("fridge")||name.includes("cupboard")||name.includes("door")){toggleState(i,"open");if(snd)play(snd);return;}
 if(name.includes("television")||name.includes("microwave")||name.includes("washing machine")||name.includes("hair dryer")||name.includes("cooker")){toggleState(i,"on");if(snd)play(snd);return;}
 state.objectStates[state.scene+":"+i]="used";if(snd)play(snd);render();
}
function scan(){
 if(state.outside){const arr=places.map(p=>({n:p.name,d:Math.hypot(p.x-state.x,p.y-state.y)})).sort((a,b)=>a.d-b.d).slice(0,4);speak(arr.map(v=>`${v.n}, ${Math.round(v.d)} metres`).join(". "));}
 else{const z=zoneAt(state.x,state.y),arr=scenes[state.scene].objects.map((o,i)=>({n:objectLabel(o,i),d:Math.hypot(o[1]-state.x,o[2]-state.y)})).sort((a,b)=>a.d-b.d).slice(0,5);speak(`${z||scenes[state.scene].name}. `+arr.map(v=>`${v.n}, ${Math.round(v.d)} metres`).join(". "));}
}
function whereAmI(){state.outside?speak("Town"):speak(`${scenes[state.scene].name}, ${zoneAt(state.x,state.y)||"inside"}`);}
function moveTick(){
 if(!touchStart||!lastTouch||multiCount!==1)return;
 const dx=lastTouch.x-touchStart.x,dy=lastTouch.y-touchStart.y,mag=Math.hypot(dx,dy);if(mag<18)return;
 const speed=Math.min(2.2,.7+mag/65);state.x=pct(state.x+dx/mag*speed);state.y=pct(state.y+dy/mag*speed);state.dir=Math.atan2(dy,dx);state.seated=false;state.lying=false;render();
}
function startMove(){if(!moveTimer)moveTimer=setInterval(moveTick,45)}
function stopMove(){if(moveTimer){clearInterval(moveTimer);moveTimer=null;}}
function touchPoint(t){return{x:t.clientX,y:t.clientY}}
gesture.addEventListener("touchstart",e=>{
 e.preventDefault();unlockSpeech();multiCount=e.touches.length;
 if(multiCount===1){const p=touchPoint(e.touches[0]);touchStart=p;lastTouch=p;tapStart=Date.now();touchMoved=false;focusAt(p.x,p.y);startMove();}
 else{stopMove();}
},{passive:false});
gesture.addEventListener("touchmove",e=>{
 e.preventDefault();multiCount=e.touches.length;
 if(multiCount===1&&touchStart){const p=touchPoint(e.touches[0]);lastTouch=p;if(Math.hypot(p.x-touchStart.x,p.y-touchStart.y)>12)touchMoved=true;focusAt(p.x,p.y);}
},{passive:false});
gesture.addEventListener("touchend",e=>{
 e.preventDefault();const endedCount=multiCount;multiCount=e.touches.length;
 if(endedCount===1){stopMove();if(!touchMoved&&Date.now()-tapStart<450)interact();touchStart=null;lastTouch=null;}
 else if(endedCount===2){stopMove();scan();}
 else if(endedCount===3){stopMove();whereAmI();}
 if(!e.touches.length){touchStart=null;lastTouch=null;stopMove();}
},{passive:false});
gesture.addEventListener("touchcancel",e=>{e.preventDefault();multiCount=0;touchStart=null;lastTouch=null;stopMove();},{passive:false});
gesture.addEventListener("mousedown",e=>{unlockSpeech();touchStart={x:e.clientX,y:e.clientY};lastTouch=touchStart;tapStart=Date.now();touchMoved=false;multiCount=1;focusAt(e.clientX,e.clientY);startMove();});
window.addEventListener("mousemove",e=>{if(!touchStart)return;lastTouch={x:e.clientX,y:e.clientY};if(Math.hypot(e.clientX-touchStart.x,e.clientY-touchStart.y)>12)touchMoved=true;focusAt(e.clientX,e.clientY);});
window.addEventListener("mouseup",()=>{if(!touchStart)return;stopMove();if(!touchMoved&&Date.now()-tapStart<450)interact();touchStart=null;lastTouch=null;multiCount=0;});
gesture.addEventListener("contextmenu",e=>e.preventDefault());

window.addEventListener("keydown",e=>{
 if(e.key==="Enter"||e.key===" ")interact();
 if(e.key.toLowerCase()==="s")scan();
 if(e.key.toLowerCase()==="w")whereAmI();
 const step=1.5;
 if(e.key==="ArrowLeft")state.x=pct(state.x-step);
 if(e.key==="ArrowRight")state.x=pct(state.x+step);
 if(e.key==="ArrowUp")state.y=pct(state.y-step);
 if(e.key==="ArrowDown")state.y=pct(state.y+step);
 render();
});

render();
})();
</script>
</body>
</html>
