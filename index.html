.player{width:24px;height:24px;border-radius:50%;background:#111;border:4px solid #fff;z-index:20;pointer-events:none}

#version{position:fixed;right:6px;bottom:calc(4px + env(safe-area-inset-bottom));font-size:9px;opacity:.25;z-index:2;pointer-events:none}

#startCard h1{margin:0 0 10px;font-size:32px}#startCard p{line-height:1.45}
#startButton{font:inherit;font-size:22px;font-weight:900;padding:18px 30px;border:3px solid #111;border-radius:18px;background:#fff;min-width:220px;min-height:66px}
#startButton:active{transform:scale(.98)}
.pic{display:block;font-size:30px;line-height:1;margin-bottom:3px}.landmark .pic{font-size:34px}.object{height:auto;min-height:58px;padding:6px 4px}.object .pic{font-size:26px}

tiltTimer=setInterval(tiltStep,65);
async function requestTilt(){try{if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){const r=await DeviceOrientationEvent.requestPermission();state.orientationPermission=r;}else if(typeof DeviceOrientationEvent!=='undefined'){state.orientationPermission='granted';}else state.orientationPermission='unavailable';}catch(e){state.orientationPermission='denied';}}
async function startGame(){startButton.disabled=true;state.started=true;loadVoices();speak('Starting game');let unlock=null;try{unlock=makeAudio('chime',.02,false);if(unlock){unlock.play().catch(()=>{});setTimeout(()=>{try{unlock.pause();}catch(e){}},80);}}catch(e){}const tiltPromise=requestTilt();await tiltPromise;startScreen.hidden=true;renderScene();setTimeout(()=>speak(state.orientationPermission==='granted'?'Game started. Tilt driving ready.':'Game started.'),100);}
startButton.addEventListener('click',startGame);

function resetTouch(t){touch.startX=t.clientX;touch.startY=t.clientY;touch.lastX=t.clientX;touch.lastY=t.clientY;touch.lastMoveX=t.clientX;touch.lastMoveY=t.clientY;touch.dx=0;touch.dy=0;touch.moved=false;touch.startTime=Date.now();touch.maxTouches=1;touch.multiMoved=false;}
gesture.addEventListener('touchstart',e=>{if(!state.started)return;e.preventDefault();touch.maxTouches=Math.max(touch.maxTouches,e.touches.length);if(e.touches.length===1){const t=e.touches[0];resetTouch(t);focusAtScreen(t.clientX,t.clientY);}else endMovement();},{passive:false});
gesture.addEventListener('touchmove',e=>{if(!state.started)return;e.preventDefault();touch.maxTouches=Math.max(touch.maxTouches,e.touches.length);if(e.touches.length!==1){touch.multiMoved=true;endMovement();return;}const t=e.touches[0],dx=t.clientX-touch.startX,dy=t.clientY-touch.startY;const px=touch.lastMoveX,py=touch.lastMoveY;touch.lastX=t.clientX;touch.lastY=t.clientY;touch.lastMoveX=t.clientX;touch.lastMoveY=t.clientY;touch.dx=dx;touch.dy=dy;if(state.heldTool||state.activeTool){if(Math.hypot(t.clientX-touch.startX,t.clientY-touch.startY)>8)touch.moved=true;useToolMotion(px,py,t.clientX,t.clientY);return;}if(Math.hypot(dx,dy)>14){touch.moved=true;focusAtScreen(t.clientX,t.clientY);beginMovement();}},{passive:false});
function handleTap(x,y){focusAtScreen(x,y);const now=Date.now(),isDouble=now-lastTap.time<330&&Math.hypot(x-lastTap.x,y-lastTap.y)<45;if(isDouble){if(tapTimer){clearTimeout(tapTimer);tapTimer=null;}lastTap.time=0;doubleTap();}else{lastTap={time:now,x,y};tapTimer=setTimeout(()=>{tapTimer=null;focusAtScreen(x,y);if(!state.heldTool&&!state.activeTool)interact();},300);}}
gesture.addEventListener('touchend',e=>{if(!state.started)return;e.preventDefault();if(e.touches.length>0)return;endMovement();stopToolSound();const count=touch.maxTouches,dur=Date.now()-touch.startTime;if(count===1&&!touch.moved&&dur<500)handleTap(touch.lastX,touch.lastY);else if(count===2&&!touch.multiMoved)scan();else if(count===3&&!touch.multiMoved)whereAmI();else if(count>=4&&!touch.multiMoved)enterExitCar();touch.maxTouches=0;touch.multiMoved=false;touch.moved=false;},{passive:false});
gesture.addEventListener('touchcancel',e=>{e.preventDefault();endMovement();stopToolSound();touch.maxTouches=0;touch.multiMoved=false;touch.moved=false;},{passive:false});
// Desktop fallback
gesture.addEventListener('mousedown',e=>{if(!state.started)return;mouseDown=true;resetTouch(e);focusAtScreen(e.clientX,e.clientY);});window.addEventListener('mousemove',e=>{if(!mouseDown)return;const px=touch.lastMoveX,py=touch.lastMoveY;touch.lastMoveX=e.clientX;touch.lastMoveY=e.clientY;if(state.heldTool||state.activeTool){touch.moved=true;useToolMotion(px,py,e.clientX,e.clientY);return;}touch.dx=e.clientX-touch.startX;touch.dy=e.clientY-touch.startY;if(Math.hypot(touch.dx,touch.dy)>14){touch.moved=true;beginMovement();}});window.addEventListener('mouseup',e=>{if(!mouseDown)return;mouseDown=false;endMovement();stopToolSound();if(!touch.moved)handleTap(e.clientX,e.clientY);});
gesture.addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('keydown',e=>{if(!state.started&&e.key==='Enter'){startGame();return;}if(e.key==='Enter'||e.key===' ')interact();if(e.key.toLowerCase()==='s')scan();if(e.key.toLowerCase()==='w')whereAmI();if(e.key.toLowerCase()==='v')enterExitCar();if(e.key.toLowerCase()==='d')doubleTap();});
renderScene();
})();
</script>
</body>
</html>
